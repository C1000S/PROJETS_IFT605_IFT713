# Installe automatiquement le binding MQTT au démarrage d'openHAB, sans passer
# par l'interface web (Settings > Add-ons). Utile pour que le projet soit
# reproductible tel quel après un "docker compose up" sur une autre machine.
binding = mqtt

# Basic UI : génère automatiquement un tableau de bord à partir d'un fichier
# .sitemap (conf/sitemaps/batiment.sitemap), sans configuration manuelle dans
# le navigateur. La "Main UI" par défaut d'openHAB 4 reste vide tant qu'on n'y
# construit pas de pages/widgets à la main ou qu'on n'ajoute pas de modèle
# sémantique (Location/Equipment) aux Items — ce qu'on n'a pas fait ici.
ui = basic
